<div class="container mt-5">
  @if (usuario()) {
    <div class="card shadow border-0 p-4">
      <div class="row align-items-center">
        <div class="col-md-4 text-center">
          <img [src]="usuario()?.image" 
               (error)="$any($event.target).src = 'https://placehold.co'"
               class="img-fluid rounded-circle shadow-sm" 
               style="max-width: 250px;">
        </div>
        <div class="col-md-8">
          <h2>{{ usuario()?.first_name }} {{ usuario()?.last_name }}</h2>
          <hr>
          <p><strong>Username:</strong> @{{ usuario()?.username }}</p>
          <p><strong>Email:</strong> {{ usuario()?.email }}</p>
          
          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-danger" (click)="confirmarEliminar()">
              <i class="bi bi-trash"></i> Eliminar
            </button>
            <button class="btn btn-warning text-white" [routerLink]="['/updateuser', usuario()?.id]">
              <i class="bi bi-pencil"></i> Actualizar
            </button>
            <button class="btn btn-secondary" routerLink="/home">
              <i class="bi bi-arrow-left"></i> Volver al listado
            </button>
          </div>
        </div>
      </div>
    </div>
  } @else {
    <div class="text-center mt-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p>Cargando detalles del usuario...</p>
    </div>
  }
</div>
