<div class="container mt-4">
  <div class="card shadow p-4 col-md-8 mx-auto">
    <h2 class="text-center mb-4">{{ titulo() }}</h2>
    <form [formGroup]="formulario" (ngSubmit)="enviar()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" formControlName="first_name" 
                 [class.is-invalid]="formulario.get('first_name')?.invalid && formulario.get('first_name')?.touched">
        </div>
        <div class="col-md-6">
          <label class="form-label">Apellido</label>
          <input type="text" class="form-control" formControlName="last_name"
                 [class.is-invalid]="formulario.get('last_name')?.invalid && formulario.get('last_name')?.touched">
        </div>
        <div class="col-md-6">
          <label class="form-label">Nombre de Usuario</label>
          <input type="text" class="form-control" formControlName="username"
                 [class.is-invalid]="formulario.get('username')?.invalid && formulario.get('username')?.touched">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email"
                 [class.is-invalid]="formulario.get('email')?.invalid && formulario.get('email')?.touched">
        </div>
        <div class="col-12">
          <label class="form-label">URL de la Imagen</label>
          <input type="text" class="form-control" formControlName="image"
                 [class.is-invalid]="formulario.get('image')?.invalid && formulario.get('image')?.touched">
        </div>
        @if (!idEdicion()) {
          <div class="col-12">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" formControlName="password"
                   [class.is-invalid]="formulario.get('password')?.invalid && formulario.get('password')?.touched">
          </div>
        }
      </div>
      <div class="d-flex justify-content-between mt-4">
        <button type="button" class="btn btn-secondary" routerLink="/home">Cancelar</button>
        <button type="submit" class="btn btn-success" [disabled]="formulario.invalid">
          {{ textoBoton() }}
        </button>
      </div>
    </form>
  </div>
</div>
